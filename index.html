<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让页面铺到刘海/挖孔屏边缘，配合 CSS 的 safe-area-inset-* 使用
         user-scalable=no：这是自定义手势的游戏类应用，禁用浏览器自身缩放，
         避免双指缩放与页面内手势冲突（裁剪器/角色缩放要自己接管双指） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2D7A5F" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <!-- 移动端全屏（添加到主屏幕后隐藏浏览器地址栏） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="萤光纪游" />
    <title>萤光纪游</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- PWA：清单用于「添加到主屏幕」后的独立窗口与图标 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/icon-192.png" />
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Live2D Cubism Core：解码 .moc3 所需的官方运行时（非 ESM，直接挂 window.Live2DCubismCore）。
         必须排在 main.js 之前，否则 pixi-live2d-display 加载时拿不到核心会直接报错。
         用相对路径 './' 是为了同时兼容 dev server(/) 与打包后的 file://(dist/)。 -->
    <script src="./live2dcubismcore.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
